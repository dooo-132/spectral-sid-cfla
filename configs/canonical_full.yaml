# canonical_full.yaml
#
# Canonical experiment configuration for the CFLA study.
#
# Every value below is either (a) read verbatim from a training log, (b) read
# from the beam-dump metadata written at inference time, or (c) read from the
# canonical result CSVs.  Nothing here is copied from the paper prose.
#
# ---------------------------------------------------------------------------
# Primary variant selection
# ---------------------------------------------------------------------------
affinity:
  primary: nonneg_pearson_v3          # S_pq = (rho_pq + 1) / 2
  ablation_only: abspearson_v3        # S_pq = |rho_pq|
  rationale: >
    The canonical affinity of the paper.  abspearson_v3 is retained ONLY as an
    affinity-function ablation and is never mixed into the main results table or
    the headline figures.

# ---------------------------------------------------------------------------
# Fusion
# ---------------------------------------------------------------------------
fusion:
  method: uniform_item_level_average
  formula: "Score(u,i) = (1/|K|) * sum_{K in {2,3,4,5}} P_K(i|u)"
  is_default: true
  tuning_required: false
  candidate_space: union_of_item_ids_from_all_K
  excluded_from_primary_method:
    - structure_aware_prior      # gamma * Q_K  -> reported as negative result
    - confidence_dynamic         # eta * Conf_K -> reported as negative result
    - validation_grid_search     # reported as ablation only
  rationale: >
    Uniform weights are the canonical fusion rule and require no tuning.
    Structure-aware and dynamic-confidence weighting are ablations only (see the
    supporting analysis code); they are not the method.

  score_normalization:
    temperature_tau_s: 1.0
    note: >
      sequence_scores stored in the beam dumps are already length-normalised
      log-probabilities (sequence_score == sum_t token_logprob / L_K); verified
      on 64/64 dump files.  A row-wise softmax over valid candidates is applied
      BEFORE any entropy computation.  Feeding raw log-probs into p*log(p)
      produces NaN and silently corrupts every ranking.

# ---------------------------------------------------------------------------
# SID construction
# ---------------------------------------------------------------------------
sid:
  construction: spectral_clustering_over_embedding_dimensions
  affinity: nonneg_pearson_v3
  codebook_size: 256                  # k-means centroids per semantic subspace
  K_values: [2, 3, 4, 5]              # number of spectral dimension groups
  sid_length_by_K: {2: 3, 3: 4, 4: 5, 5: 6}   # L_K = K + 1
  vocab_size_by_K: {2: 769, 3: 1025, 4: 1281, 5: 1537}   # = 256*L_K + 1
  token_layout: "token = code + position*256 + 1"
  collision_handling: deterministic_disambiguation_token
  collision_note: >
    The appended disambiguation token makes the full SID injective BY
    CONSTRUCTION, so final_collision_rate == 0 identically and is a design
    property, not an empirical result.  Report prefix/base collision rate.
  subspace_preprocessing: standardize_then_pca_whiten_above_threshold
  embedding_backbone: sentence-t5-base
  embedding_dim: 768

# ---------------------------------------------------------------------------
# Generative model (identical for every K and every dataset)
# ---------------------------------------------------------------------------
model:
  architecture: T5 encoder-decoder
  num_encoder_layers: 4
  num_decoder_layers: 4
  d_model: 128
  d_ff: 1024
  num_heads: 6
  d_kv: 64
  dropout_rate: 0.1
  feed_forward_proj: relu
  pad_token_id: 0
  eos_token_id: 0

training:
  batch_size: 256
  lr: 1.0e-4
  num_epochs: 200
  early_stop_patience: 10
  early_stop_monitor: validation NDCG@20
  max_len: 20                          # maximum interaction history length
  seed: 2025                           # SINGLE seed for every configuration
  infer_size: 96
  num_seeds_per_configuration: 1       # see MISSING_EXPERIMENTS.md

inference:
  beam_size: 30
  num_return_sequences: 30
  candidate_decode_health_check: ">0.90 valid decode rate, else RuntimeError"

# ---------------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------------
datasets:
  - key: Beauty
    display: Beauty
    n_items: 12101
    n_test_users: 22363
  - key: Cell_Phones_and_Accessories
    display: Cell Phones
    n_items: 10429
    n_test_users: 27879
  - key: Health_and_Personal_Care
    display: Health
    n_items: 18534
    n_test_users: 38609
  - key: Toys_and_Games
    display: Toys
    n_items: 11924
    n_test_users: 19412
source: Amazon Review 2014 (5-core, chronological leave-one-out)

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
metrics: [Recall@5, Recall@10, Recall@20, NDCG@5, NDCG@10, NDCG@20]

validation_protocol:
  split_type: inherited_style_chronological
  same_users_in_train_valid_test: true
  description: >
    The same users appear in train/valid/test; the three splits are consecutive
    chronological segments of each user's sequence.  valid.target equals the
    last item of the validation segment and test.history is exactly the
    validation segment, so validation and test are ADJACENT exposures of the
    same user, not independent populations.  This must not be described as an
    independent validation population.
  verified:
    - "valid.target == test.history[-1] : 200/200 sampled users (Beauty, Toys)"
    - "valid.history is a prefix of test.history : 200/200 sampled users"
  consequence: validation-based selection is mildly optimistic
  mitigations:
    - no test-set hyper-parameter selection anywhere
    - primary method (uniform fusion) requires no selection at all

# ---------------------------------------------------------------------------
# Significance testing
# ---------------------------------------------------------------------------
statistics:
  test: paired_user_level_bootstrap
  n_resamples: 5000
  seed: 20260912
  ci: 95
  primary_comparison: uniform_multi_granularity_vs_best_single_K
  secondary_comparison: dynamic_vs_uniform

# ---------------------------------------------------------------------------
# Known data conventions (must be honoured by any new code)
# ---------------------------------------------------------------------------
conventions:
  dumped_item_ids_are_zero_based: true
  canonical_item_id_is_one_based: true
  canonicalization: "canonical_item_id = dumped_item_id + 1; -1 is the no-item sentinel"
  note: >
    Every beam dump in the repository was produced by the PRE-FIX
    dump_beam_outputs.build_sid_to_item, which stored the 0-based row index of
    the SID array.  Ranking metrics are invariant under this uniform shift, but
    collision/prefix analysis and any join against the SID arrays require the
    +1 canonicalization.  See fusion_audit.canonicalize_item_ids.
  checkpoint_path_base: >
    The ckpt_path recorded inside each dump is relative to model/ (e.g.
    "ckpt/tiger_Beauty_..._k2_sid3.pth" resolves to
    model/ckpt/tiger_Beauty_..._k2_sid3.pth).
